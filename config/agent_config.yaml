dqn:
  deepset:
    fc1_dims: 64
    fc2_dims: 64
    embedding_dims: 64
  final_fc_dims: 32
  dropout: 0.1

# # Small numbers for pipeline test only
# dqn:
#   deepset:
#     fc1_dims: 16
#     fc2_dims: 32
#     embedding_dims: 64
#   final_fc_dims: 8
#   dropout: 0.1

train:
  epochs: 100
  epochs_freeze: 10  # Stop learning, only collect experience and run evaluation
  train_freq: 4      # Learn every N steps
  lr: 0.0005
  batch_size: 64
  gamma: 0.95
  epsilon:
    init: 1.0
    min: 0.001
    decay: 0.996
    decay_interval: 1000  # Steps per epsilon decay
